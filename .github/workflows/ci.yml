name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  syntax-and-privacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: |
          find lib -name '*.js' -print0 | xargs -0 -n1 node --check
          node --check tools/privacy-scan.mjs
      - name: Privacy scan
        run: node tools/privacy-scan.mjs
